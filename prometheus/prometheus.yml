global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sentistream-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']

  - job_name: 'sentistream-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8001']
