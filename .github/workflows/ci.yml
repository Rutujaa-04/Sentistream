name: SentiStream CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          pip install ruff

      - name: Run Ruff Lint
        run: ruff check . --select E,F,I --ignore E501

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
      clickhouse:
        image: clickhouse/clickhouse-server:24.3-alpine
        ports:
          - 9000:9000
          - 8123:8123
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: sentistream
    steps:
      - uses: actions/checkout@v4

      - name: Wait for services to be ready
        run: |
          for i in {1..30}; do
            nc -z localhost 6379 && curl -s http://localhost:8123/ping | grep -q "Ok" && echo "Redis and ClickHouse are healthy!" && exit 0
            echo "Waiting for Redis and ClickHouse..."
            sleep 2
          done
          echo "Services failed to become healthy in time!"
          exit 1
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Cache Compiled ONNX Models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          key: model-cache-${{ runner.os }}-${{ hashFiles('backend/ml/export_onnx.py', 'backend/requirements.txt') }}

      - name: Cache Hugging Face cache
        id: cache-hf
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            hf-cache-${{ runner.os }}-
          
      - name: Compile and Export ONNX Model
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: python backend/ml/export_onnx.py
        
      - name: Run Pytest Suite with Coverage
        env:
          PYTHONPATH: backend
          REDIS_URL: redis://localhost:6379
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: 9000
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: sentistream
          CLICKHOUSE_DATABASE: default
          FINNHUB_API_KEY: ""
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-report=term --cov-fail-under=45


  ml-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Cache Compiled ONNX Models
        id: cache-models
        uses: actions/cache@v4
        with:
          path: models
          key: model-cache-${{ runner.os }}-${{ hashFiles('backend/ml/export_onnx.py', 'backend/requirements.txt') }}

      - name: Cache Hugging Face cache
        id: cache-hf
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            hf-cache-${{ runner.os }}-
          
      - name: Export Quantized ONNX Model
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: python backend/ml/export_onnx.py
        
      - name: Run Model Performance Benchmark
        env:
          PYTHONPATH: backend
        run: python backend/ml/benchmark_ci.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Run pip-audit
        run: |
          pip install pip-audit
          # Ignore safety audits on non-critical local dev packages if necessary, otherwise scan requirements
          # We ignore PYSEC-2025-217 and CVE-2026-1839 because they are in transformers v4, which is strictly required by optimum-onnx
          pip-audit --ignore-vuln PYSEC-2025-217 --ignore-vuln CVE-2026-1839 -r backend/requirements.txt
          
      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=critical

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          
      - name: Build React Application
        run: |
          cd frontend
          npm ci
          npm run build
