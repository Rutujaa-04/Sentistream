version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: sentistream-redis
    ports:
      - "6379:6379"
    command: >
      redis-server 
      --save "" 
      --appendonly no 
      --maxmemory 200mb 
      --maxmemory-policy allkeys-lru
    networks:
      - sentistream-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: sentistream-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=sentistream
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - sentistream-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sentistream-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sentistream-network

  grafana:
    image: grafana/grafana:10.4.1
    container_name: sentistream-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=5s
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    networks:
      - sentistream-network

volumes:
  clickhouse-data:

networks:
  sentistream-network:
    driver: bridge
